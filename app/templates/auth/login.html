{% extends "public.html" %}
{% import "_macros.html" as m %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1 class="page-title">Log in</h1>
<p class="text-secondary mb-4">{{ tagline }}</p>
<form method="post" novalidate>
  {{ m.csrf() }}
  <div class="mb-3">
    <label class="form-label" for="email">Email address</label>
    <input class="form-control" id="email" name="email" type="email" autocomplete="email" required autofocus value="{{ form.get('email', '') }}">
  </div>
  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" id="remember" name="remember">
    <label class="form-check-label" for="remember">Keep me logged in on this device</label>
  </div>
  <button class="btn btn-primary w-100" type="submit">Log in</button>
</form>
<p class="mb-2"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>
{% if registration_open %}<p class="mt-3 mb-0 text-secondary">No account yet? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endif %}
{% endblock %}
